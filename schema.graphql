type Query {
  store(id: ID!): Store
  stores: [Store!]!

  "Dados da loja. Sem websiteId, os do escopo Padrão; website desconhecido dá null."
  storeInfo(websiteId: ID): StoreInfo

  "Por id ou por SKU (sem diferenciar maiúsculas); informe um dos dois."
  product(id: ID, sku: String): Product

  "As categorias principais; as outras vêm em children."
  categories(
    "Só as do website."
    websiteId: ID
  ): [Category!]!

  "Por id ou por url_key; informe um dos dois. A url_key é única por website."
  category(
    id: ID
    url_key: String

    "Website da url_key; omitido = website padrão."
    websiteId: ID
  ): Category

  "O que abre num endereço da loja: \"/calca-jeans\" ou \"calca-jeans\" (vale a última parte, \"/vestuario/calca-jeans\" também). Produto do website primeiro, depois categoria; null quando não há nada."
  route(
    url: String!

    "Omitido = website padrão."
    websiteId: ID
  ): Route

  products(
    "Parte do SKU ou do nome."
    search: String

    "Só os produtos do website."
    websiteId: ID

    attributeSetId: ID

    "Inclui as subcategorias."
    categoryId: ID

    "Só para o admin; fora dele a lista traz apenas produtos ativos."
    isActive: Boolean

    "Filtros da loja (attributes com isFilterable). Entre filtros vale E; dentro de um, qualquer um dos values. Vale o produto ou uma das suas variações."
    filters: [ProductFilterInput!]

    priceFrom: Float
    priceTo: Float
    page: Int = 1

    "Máximo 100."
    pageSize: Int = 20
  ): ProductList!
  inventorySources: [InventorySource!]!
  inventorySource(code: String!): InventorySource

  "Por id ou por e-mail; informe um dos dois. O e-mail é único por website."
  customer(
    id: ID
    email: String

    "Website do e-mail; omitido = website padrão."
    websiteId: ID
  ): Customer

  "O cliente do token; null sem login de cliente."
  me: Customer

  customers(
    "Parte do nome, razão social, e-mail ou CPF/CNPJ."
    search: String

    type: CustomerType
    groupId: ID
    websiteId: ID
    isActive: Boolean
    page: Int = 1

    "Máximo 100."
    pageSize: Int = 20
  ): CustomerList!

  "Os atributos de uma entidade (product, customer, customer_address, category), na ordem de posição. Os ocultos só aparecem para o admin."
  attributes(entityType: String!): [AttributeDefinition!]!

  cart(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String
  ): Cart!
  orders(
    status: OrderStatus
    websiteId: ID
    customerId: ID

    "Parte do número, do e-mail ou do nome."
    search: String

    "Feitos a partir deste dia (AAAA-MM-DD)."
    from: String

    "Até este dia, inclusive (AAAA-MM-DD)."
    to: String

    page: Int = 1

    "Máximo 100."
    pageSize: Int = 20

    sort: OrderSort = CREATED_AT
    sortDir: SortDirection = DESC
  ): OrderList!

  "Pelo id ou pelo número (SP-000001). null se não existir."
  order(
    id: ID
    number: String

    "Com number, quando dois websites usam o mesmo prefixo."
    websiteId: ID
  ): Order

  "Os pedidos do cliente do token, o mais novo primeiro."
  myOrders(
    page: Int = 1

    "Máximo 100."
    pageSize: Int = 20
  ): MyOrderList!

  "Um pedido do cliente do token pelo número; null se não for dele."
  myOrder(number: String!): Order

  "Consulta sem login: o número e o e-mail do pedido. null se não baterem. Limite de consultas por minuto por IP."
  guestOrder(
    number: String!
    email: String!

    "Quando dois websites usam o mesmo prefixo."
    websiteId: ID
  ): Order

  "Quantos pedidos e quanto em cada situação, no período (todas as situações vêm, mesmo com 0)."
  salesSummary(
    websiteId: ID

    "Feitos a partir deste dia (AAAA-MM-DD)."
    from: String

    "Até este dia, inclusive (AAAA-MM-DD)."
    to: String
  ): [SalesSummaryRow!]!

  shippingTableRates(
    "Omitido = website padrão."
    websiteId: ID
  ): [ShippingTableRate!]!

  "O usuário do token (ou da sessão do painel); null sem login."
  currentAdmin: AdminUser
}

type Store {
  id: ID!
  store_name: String!
  webview: String!
  theme: String!
  group_id: ID
  created_at: String!
  updated_at: String!
}

type StoreInfo {
  name: String
  taxId: String
  phone: String
  email: String
  details: String
  logoUrl: String
  address: StoreAddress!
}

type StoreAddress {
  postcode: String
  street: String
  number: String
  complement: String
  district: String
  city: String
  region: String
  country: String
}

type Product {
  id: ID!
  type: ProductType!

  "Os atributos da grade (produto com grade)."
  variantAttributes: [VariantAttribute!]!

  "As variações (produto com grade); fora do admin, só as ativas."
  variants: [Product!]!

  "Para a vitrine: o preço do produto; num produto com grade, o menor e o maior das variações ativas (\"a partir de\" = min)."
  priceRange: PriceRange!

  "A combinação da variação (ex.: Cor = Azul, Tamanho = P)."
  variantOptions: [ProductOption!]!

  "O produto com grade, numa variação."
  parent: Product

  sku: String!
  name: String!

  "Para route(url). null nas variações, que abrem pela URL do pai."
  url_key: String

  is_active: Boolean!
  attribute_set_id: ID!
  created_at: String!
  updated_at: String!
  attributes: [ProductAttribute!]!
  websiteIds: [ID!]!
  categories: [Category!]!

  "Com websiteId, o que aquela loja pode vender: as origens do website menos as reservas dos pedidos dele. A vitrine deve informar o seu."
  stock(websiteId: ID): ProductStock!
}

enum ProductType {
  SIMPLE

  "Com grade: as variações têm o estoque, o preço e as fotos."
  CONFIGURABLE
}

type VariantAttribute {
  code: String!
  label: String!

  "Só as opções usadas pelas variações."
  options: [ProductOption!]!
}

type ProductOption {
  code: String
  value: String!
  label: String!
}

type PriceRange {
  min: Float
  max: Float
}

type ProductAttribute {
  code: String!

  "Nome do atributo, como editado em Catálogo → Atributos."
  label: String!

  "Valor de atributos de valor único (Sim/Não = \"1\"/\"0\")."
  value: String

  "Valores de atributos de múltipla seleção."
  values: [String!]

  "Rótulo da opção escolhida, em atributos de opções (Seleção, Opções)."
  option_label: String

  "Rótulos das opções escolhidas, na mesma ordem de values (Múltipla seleção)."
  option_labels: [String!]

  "URL do arquivo, em atributos de arquivo (imagem)."
  url: String
}

type Category {
  id: ID!
  websiteId: ID!
  name: String!
  url_key: String!
  is_active: Boolean!
  position: Int!

  "0 = categoria principal."
  level: Int!

  parent_id: ID
  children: [Category!]!

  "Inclui os produtos das subcategorias."
  products(
    page: Int = 1

    "Máximo 100."
    pageSize: Int = 20
  ): ProductList!

  created_at: String!
  updated_at: String!
}

type ProductList {
  items: [Product!]!
  total: Int!

  "Os filtros da loja para esta busca: contagem por opção (a do próprio filtro ignora a escolha nele) e a faixa de preço."
  aggregations: ProductAggregations!
}

type ProductAggregations {
  attributes: [ProductAggregation!]!

  "Menor e maior preço dos produtos da busca (sem o filtro de preço); null sem preço."
  price: PriceRange!
}

type ProductAggregation {
  code: String!
  label: String!
  options: [ProductAggregationOption!]!
}

type ProductAggregationOption {
  value: String!
  label: String!
  count: Int!
}

type ProductStock {
  "Soma das quantidades \"em estoque\" nas origens ativas (do website pedido, ou de todos os do produto), menos as reservas dos pedidos."
  salable_quantity: Float!

  is_in_stock: Boolean!

  "Quantidade em cada origem dos websites do produto. Só para o admin."
  sources: [ProductStockSource!]!
}

type ProductStockSource {
  code: String!
  name: String!
  is_enabled: Boolean!
  quantity: Float!

  "1 = em estoque, 0 = fora de estoque."
  status: Int!
}

type Route {
  "PRODUCT ou CATEGORY."
  type: String!

  product: Product
  category: Category
}

input ProductFilterInput {
  code: String!

  "Valores das opções; Sim/Não = \"1\"/\"0\"."
  values: [String!]!
}

type InventorySource {
  id: ID!
  websiteId: ID!
  code: String!
  name: String!
  is_enabled: Boolean!

  "Menor = usada primeiro."
  priority: Int!

  description: String
  postcode: String
  city: String
  region: String
  country_code: String!
}

type Customer {
  id: ID!
  websiteId: ID!
  groupId: ID!
  attribute_set_id: ID!
  type: CustomerType!
  email: String!
  firstname: String!
  lastname: String!

  "CPF (PF) ou CNPJ (PJ), só os dígitos."
  taxvat: String

  "Nascimento (PF), AAAA-MM-DD."
  dob: String

  "Razão social (PJ)."
  company_name: String

  "Nome fantasia (PJ)."
  trade_name: String

  "Inscrição estadual (PJ)."
  state_registration: String

  is_ie_exempt: Boolean!
  is_active: Boolean!
  created_at: String!
  updated_at: String!
  attributes: [CustomerAttribute!]!

  "Os padrões primeiro."
  addresses: [CustomerAddress!]!
}

enum CustomerType {
  "Pessoa física."
  PF

  "Pessoa jurídica."
  PJ
}

type CustomerAttribute {
  code: String!

  "Valor de atributos de valor único (Sim/Não = \"1\"/\"0\")."
  value: String

  "Valores de atributos de múltipla seleção."
  values: [String!]

  "Rótulo da opção escolhida, em atributos de opções."
  option_label: String

  "Rótulos das opções escolhidas (Múltipla seleção)."
  option_labels: [String!]
}

type CustomerAddress {
  id: ID!
  recipient: String

  "Só os 8 dígitos."
  postcode: String!

  street: String!
  number: String!
  complement: String
  district: String!
  city: String!

  "UF, ex.: SP."
  region: String!

  telephone: String

  "Os campos que o admin criou no conjunto de endereço (os de cima ficam fora)."
  attributes: [CustomerAttribute!]!

  is_default_shipping: Boolean!
  is_default_billing: Boolean!
}

type CustomerList {
  items: [Customer!]!
  total: Int!
}

type AttributeDefinition {
  code: String!
  label: String!

  "text, textarea, select, multiselect, boolean, date, phone, cep, email, cpf_cnpj, image..."
  inputType: String!

  "true: o valor é uma lista (values)."
  multiple: Boolean!

  "Máscara do campo: phone, cep, cpf_cnpj ou email."
  mask: String

  defaultValue: String
  isRequired: Boolean!
  isVisible: Boolean!
  isSearchable: Boolean!
  isFilterable: Boolean!
  isSortable: Boolean!

  "\"Usar na grade\" (produtos com variações)."
  isVariant: Boolean!

  isSystem: Boolean!
  sortOrder: Int!

  "Vazio nos tipos sem opções."
  options: [AttributeOption!]!
}

type AttributeOption {
  value: String!
  label: String!
  isDefault: Boolean!
}

type Cart {
  "As opções de frete agora, a mais barata primeiro. Frete por tabela e grátis pedem o endereço de entrega."
  availableShippingMethods: [ShippingMethod!]!

  "O escolhido; null se nenhum ou se deixou de valer (endereço mudou)."
  shippingMethod: ShippingMethod

  shippingAmount: Float!
  availablePaymentMethods: [PaymentMethod!]!

  "O escolhido; null se nenhum ou se foi desligado."
  paymentMethod: PaymentMethod

  websiteId: ID!
  isGuest: Boolean!
  email: String
  firstname: String
  lastname: String

  "CPF ou CNPJ, só os dígitos."
  taxvat: String

  items: [CartItem!]!
  itemsQuantity: Float!
  subtotal: Float!

  "Subtotal + frete escolhido."
  total: Float!

  "Algum item com error."
  hasErrors: Boolean!

  shippingAddress: CartAddress

  "Sem um próprio, o de entrega."
  billingAddress: CartAddress

  billingSameAsShipping: Boolean!
}

type ShippingMethod {
  "tablerate, freeshipping ou pickup."
  code: String!

  label: String!
  amount: Float!

  "Prazo em dias úteis."
  days: Int!
}

type PaymentMethod {
  "pix ou offline."
  code: String!

  label: String!

  "O que o cliente faz para pagar (a chave Pix, por exemplo). Também vai no pedido."
  instructions: String
}

type CartItem {
  id: ID!
  sku: String!
  name: String!
  quantity: Float!

  "O preço de agora; null sem preço."
  price: Float

  rowTotal: Float!

  "Por que o item não pode ser comprado assim (inativo, sem estoque suficiente...). Com erro, o pedido é recusado."
  error: String

  "PRODUCT_NOT_SALABLE, INSUFFICIENT_STOCK ou PRODUCT_IS_CONFIGURABLE."
  errorCode: String

  product: Product
}

type CartAddress {
  "Os campos que o admin criou no conjunto de endereço."
  attributes: [CartAddressAttribute!]!

  postcode: String
  street: String
  number: String
  complement: String
  district: String
  city: String
  region: String
  recipient: String
  telephone: String
}

type CartAddressAttribute {
  code: String!
  value: String
  values: [String!]
}

enum OrderStatus {
  "Aguardando pagamento"
  pending_payment

  "Pagamento confirmado"
  processing

  "Enviado"
  shipped

  "Concluído"
  complete

  "Cancelado"
  canceled
}

enum OrderSort {
  CREATED_AT
  NUMBER
  CUSTOMER
  TOTAL
  STATUS
}

enum SortDirection {
  ASC
  DESC
}

type OrderList {
  items: [Order!]!
  total: Int!

  "Soma dos pedidos filtrados, sem os cancelados."
  amount: Float!
}

type Order {
  id: ID!

  "O número que o cliente vê (SP-000001)."
  number: String!

  "pending_payment, processing, shipped, complete ou canceled."
  status: String!

  statusLabel: String!
  createdAt: String!
  email: String!
  firstname: String!
  lastname: String!

  "CPF ou CNPJ, só os dígitos."
  taxvat: String!

  items: [OrderItem!]!
  subtotal: Float!
  shippingAmount: Float!
  total: Float!

  "O code do frete escolhido."
  shippingMethod: String

  shippingLabel: String

  "O prazo em dias úteis prometido no pedido."
  shippingDays: Int

  "O code do pagamento escolhido."
  paymentMethod: String

  paymentLabel: String

  "O que o cliente faz para pagar (a chave Pix, por exemplo), como era no pedido."
  paymentInstructions: String

  shippingAddress: CartAddress
  billingAddress: CartAddress
  websiteId: ID!

  "null = visitante."
  customerId: ID

  "A entrega; null antes do envio."
  shipment: OrderShipment

  "Situações e comentários, o mais novo primeiro. Só para o admin com Iter_Sales::order; para os outros, null."
  history: [OrderHistory!]
}

type OrderItem {
  sku: String!
  name: String!

  "A variação comprada (\"Cor: Preto, Tamanho: M\")."
  options: String

  quantity: Float!
  price: Float!
  rowTotal: Float!
}

type OrderShipment {
  carrier: String
  trackingCode: String
  createdAt: String!

  "De onde saiu (só para o admin com Iter_Sales::order)."
  sourceName: String
}

type OrderHistory {
  status: String!
  comment: String
  customerNotified: Boolean!

  "Quem fez; null = o próprio pedido (placeOrder)."
  adminUsername: String

  createdAt: String!
}

type MyOrderList {
  items: [Order!]!
  total: Int!
}

type SalesSummaryRow {
  status: OrderStatus!
  statusLabel: String!
  count: Int!
  amount: Float!
}

type ShippingTableRate {
  postcodeFrom: String!
  postcodeTo: String!
  weightTo: Float
  price: Float!

  "Prazo em dias úteis."
  days: Int!
}

type AdminUser {
  id: ID!
  username: String!
  firstname: String
  lastname: String
  email: String

  "Nome do perfil de acesso."
  role: String
}

type Mutation {
  createStore(storeName: String!, webview: String!, theme: String!, groupId: ID): Store!
  updateStore(id: ID!, storeName: String!, webview: String!, theme: String!, groupId: ID): Store
  deleteStore(id: ID!): Boolean!
  createProduct(
    sku: String!
    name: String!

    "Omitida = gerada do nome."
    urlKey: String

    "Omitido = conjunto padrão de produto."
    attributeSetId: ID

    isActive: Boolean = true
    attributes: [ProductAttributeInput!]

    "Omitido = website padrão."
    websiteIds: [ID!]

    "Obrigatório: ao menos uma categoria dos websites do produto."
    categoryIds: [ID!]

    "Não muda depois."
    type: ProductType = SIMPLE

    "Com grade: de 1 a 3 códigos de atributos de seleção do conjunto."
    variantAttributes: [String!]
  ): Product!

  "Só muda o que for enviado; atributos omitidos mantêm o valor. O conjunto não muda."
  updateProduct(
    id: ID!
    sku: String
    name: String

    "Vazia = gerada do nome; omitida = sem mudança."
    urlKey: String

    isActive: Boolean
    attributes: [ProductAttributeInput!]

    "Substitui os websites (ao menos um)."
    websiteIds: [ID!]

    "Substitui as categorias (ao menos uma)."
    categoryIds: [ID!]
  ): Product!

  "A lista enviada é a lista final: variação ausente é removida, com o estoque dela."
  saveVariants(productId: ID!, variants: [VariantInput!]!): [Product!]!

  deleteProduct(id: ID!): Boolean!

  "Envia a imagem de um atributo de imagem do conjunto do produto (troca a atual), pelo multipart request spec com token. Tipos e tamanho são os do painel. Num produto com grade, a imagem vai em cada variação."
  uploadProductImage(productId: ID!, code: String!, file: Upload!): Product!

  "Sem parentId, uma categoria principal do website. Uma subcategoria fica no website da mãe. urlKey omitida sai do nome."
  createCategory(
    "Omitido = website padrão; ignorado numa subcategoria."
    websiteId: ID

    parentId: ID
    name: String!
    urlKey: String
    isActive: Boolean = true
    position: Int = 0

    "Atributos de categoria (Catálogo → Atributos, entidade Categoria)."
    attributes: [ProductAttributeInput!]
  ): Category!

  "Só muda o que for enviado. Para trocar a categoria mãe, use moveCategory."
  updateCategory(id: ID!, name: String, urlKey: String, isActive: Boolean, position: Int, attributes: [ProductAttributeInput!]): Category!

  "Muda a categoria mãe (sem parentId = principal) e a posição. Fica no mesmo website; não vai para dentro dela mesma nem de uma subcategoria sua."
  moveCategory(id: ID!, parentId: ID, position: Int): Category!

  "Recusada com subcategorias (CATEGORY_HAS_CHILDREN) ou produtos (CATEGORY_HAS_PRODUCTS)."
  deleteCategory(id: ID!): Boolean!

  "Só muda as origens enviadas; as outras mantêm o que têm."
  setProductStock(sku: String!, sources: [ProductStockInput!]!): ProductStock!

  "Cadastro pela loja: a conta entra no grupo Geral, ativa. Com a confirmação de e-mail ligada, não traz token até confirmCustomerEmail."
  registerCustomer(
    "Omitido = website padrão."
    websiteId: ID

    email: String!
    firstname: String!
    lastname: String!
    type: CustomerType!

    "CPF (PF) ou CNPJ (PJ), com ou sem máscara."
    taxvat: String!

    "AAAA-MM-DD, só PF."
    dob: String

    "Obrigatória para PJ."
    companyName: String

    tradeName: String

    "Para PJ: a inscrição estadual ou isIeExempt."
    stateRegistration: String

    isIeExempt: Boolean
    attributes: [CustomerAttributeInput!]
    password: String!
  ): CustomerSession!

  "O token do link do e-mail de confirmação. Confirma e já entra."
  confirmCustomerEmail(token: String!): CustomerSession!

  "Login do cliente pela loja."
  generateCustomerToken(
    email: String!
    password: String!

    "Omitido = website padrão."
    websiteId: ID
  ): CustomerSession!

  "Troca o token enviado por um novo, com a validade renovada (app mobile)."
  refreshCustomerToken: CustomerSession!

  "Logout: o token enviado deixa de valer. false sem token de cliente."
  revokeCustomerToken: Boolean!

  "Senha esquecida: manda o e-mail com o link do frontend (Configurações → Clientes → link de nova senha). Sempre true, exista ou não o e-mail."
  requestCustomerPasswordReset(
    email: String!

    "Omitido = website padrão."
    websiteId: ID
  ): Boolean!

  "O token do link do e-mail + a nova senha. O link vale uma vez; todos os logins do cliente caem, e ele entra de novo com generateCustomerToken."
  resetCustomerPassword(token: String!, password: String!): Boolean!

  "O cliente do token muda os próprios dados; só muda o que for enviado. Trocar e-mail ou CPF/CNPJ pede currentPassword."
  updateMe(
    email: String
    firstname: String
    lastname: String
    type: CustomerType

    "CPF (PF) ou CNPJ (PJ), com ou sem máscara."
    taxvat: String

    "AAAA-MM-DD, só PF."
    dob: String

    "Obrigatória para PJ."
    companyName: String

    tradeName: String

    "Para PJ: a inscrição estadual ou isIeExempt."
    stateRegistration: String

    isIeExempt: Boolean
    attributes: [CustomerAttributeInput!]

    "Obrigatória para trocar e-mail ou CPF/CNPJ."
    currentPassword: String
  ): Customer!

  "Troca a senha do cliente do token. Os outros logins (tokens) deixam de valer; o enviado continua."
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!

  "Novo endereço do cliente do token. Devolve a lista, os padrões primeiro. O primeiro endereço vira o padrão."
  createMyAddress(address: CustomerAddressInput!): [CustomerAddress!]!

  "Troca o endereço inteiro (o id vem em address.id). Marcar um padrão tira o de outro endereço; desmarcar não muda o padrão (use setMyDefaultAddress em outro)."
  updateMyAddress(address: CustomerAddressInput!): [CustomerAddress!]!

  "Torna o endereço o padrão de entrega e/ou de cobrança."
  setMyDefaultAddress(id: ID!, shipping: Boolean = true, billing: Boolean = true): [CustomerAddress!]!

  "Remove o endereço. Se era o padrão, o primeiro que sobrar vira o padrão."
  deleteMyAddress(id: ID!): [CustomerAddress!]!

  createCustomer(
    "Omitido = website padrão."
    websiteId: ID

    groupId: ID!
    email: String!
    firstname: String!
    lastname: String!
    type: CustomerType!

    "CPF (PF) ou CNPJ (PJ), com ou sem máscara."
    taxvat: String!

    "AAAA-MM-DD, só PF."
    dob: String

    "Obrigatória para PJ."
    companyName: String

    tradeName: String

    "Para PJ: a inscrição estadual ou isIeExempt."
    stateRegistration: String

    isIeExempt: Boolean
    isActive: Boolean = true
    attributes: [CustomerAttributeInput!]
    addresses: [CustomerAddressInput!]

    "Omitido = conjunto padrão de cliente."
    attributeSetId: ID
  ): Customer!

  "Só muda o que for enviado; atributos omitidos mantêm o valor. O conjunto não muda."
  updateCustomer(
    id: ID!
    websiteId: ID
    groupId: ID
    email: String
    firstname: String
    lastname: String
    type: CustomerType

    "CPF (PF) ou CNPJ (PJ), com ou sem máscara."
    taxvat: String

    "AAAA-MM-DD, só PF."
    dob: String

    "Obrigatória para PJ."
    companyName: String

    tradeName: String

    "Para PJ: a inscrição estadual ou isIeExempt."
    stateRegistration: String

    isIeExempt: Boolean
    isActive: Boolean
    attributes: [CustomerAttributeInput!]

    "A lista enviada é a lista final: endereço ausente é removido. Omitido = sem mudança."
    addresses: [CustomerAddressInput!]
  ): Customer!

  "Apaga também os endereços e os atributos."
  deleteCustomer(id: ID!): Boolean!

  "Novo carrinho de visitante; devolve o cartId (guarde-o: ele é a chave do carrinho). O cliente logado não precisa: usa o dele. Depois do login, mergeCarts junta os dois."
  createCart(
    "Omitido = website padrão."
    websiteId: ID
  ): String!

  "Soma à quantidade que já estiver no carrinho. O produto com grade não entra: envie o SKU da variação."
  addToCart(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String

    sku: String!
    quantity: Float! = 1
  ): Cart!

  "A nova quantidade do item; 0 remove."
  updateCartItem(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String

    itemId: ID!
    quantity: Float!
  ): Cart!

  removeCartItem(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String

    itemId: ID!
  ): Cart!

  "Depois do login: os itens do carrinho de visitante (cartId) vão para o do cliente, somando as quantidades, e o de visitante deixa de existir."
  mergeCarts(cartId: String!): Cart!

  "Dados do visitante para o pedido. O cliente logado não usa: os dados vêm da conta."
  setCartGuestInfo(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String

    email: String!
    firstname: String!
    lastname: String!

    "CPF ou CNPJ, com ou sem máscara."
    taxvat: String!
  ): Cart!

  "O endereço digitado (address) ou um salvo do cliente (customerAddressId). As regras são as do endereço do cliente."
  setCartShippingAddress(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String

    address: CartAddressInput
    customerAddressId: ID
  ): Cart!

  "Um code de availableShippingMethods."
  setCartShippingMethod(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String

    code: String!
  ): Cart!

  "Um code de availablePaymentMethods."
  setCartPaymentMethod(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String

    code: String!
  ): Cart!

  "Fecha o pedido: confere o carrinho (o erro diz o que falta), reserva o estoque e envia o e-mail \"pedido recebido\". Chamar de novo com o mesmo carrinho devolve o mesmo pedido."
  placeOrder(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String
  ): Order!

  "Como o de entrega; sem address nem customerAddressId, a cobrança é no endereço de entrega."
  setCartBillingAddress(
    "O do createCart (visitante). Cliente logado omite: vale o carrinho dele."
    cartId: String

    address: CartAddressInput
    customerAddressId: ID
  ): Cart!

  "Aguardando pagamento → Pagamento confirmado. Avisa o cliente. Exige Iter_Sales::order_payment."
  confirmOrderPayment(
    id: ID!

    "Ex.: comprovante recebido pelo WhatsApp."
    comment: String
  ): Order!

  "Pagamento confirmado → Enviado: baixa o estoque da origem e manda o rastreio ao cliente. Exige Iter_Sales::order_ship."
  shipOrder(
    id: ID!

    "A origem de onde sai. Omitida = a sugerida (a que tem tudo e mais estoque)."
    sourceCode: String

    carrier: String
    trackingCode: String
  ): Order!

  "Enviado → Concluído (o cliente recebeu). Exige Iter_Sales::order_ship."
  completeOrder(id: ID!): Order!

  "Antes do envio: devolve a reserva e avisa o cliente com o motivo. Exige Iter_Sales::order_cancel."
  cancelOrder(id: ID!, reason: String!): Order!

  "Comentário no histórico, em qualquer situação."
  addOrderComment(
    id: ID!
    comment: String!

    "Manda o comentário ao cliente por e-mail."
    notifyCustomer: Boolean = false
  ): Order!

  "Um pedido em montagem pelo admin; devolve o cartId, usado nas mutations do carrinho e no placeAdminOrder. Sem customerId, o pedido é de um visitante (setCartGuestInfo), se o website vende para visitante."
  createAdminCart(
    "Omitido = website padrão."
    websiteId: ID

    "Um cliente do website."
    customerId: ID
  ): String!

  "Fecha o pedido em montagem. O pedido fica com o admin do token."
  placeAdminOrder(
    cartId: String!

    "Já confirma o pagamento (balcão, dinheiro). Exige Iter_Sales::order_payment."
    paymentReceived: Boolean = false

    "Manda ao cliente os e-mails do pedido."
    notifyCustomer: Boolean = true

    "Comentário interno no histórico (não vai para o cliente)."
    comment: String
  ): Order!

  "A lista enviada é a tabela inteira do website (faixa ausente é removida). CEP com ou sem máscara. Para um CEP, vale a faixa com o menor \"peso até\" que comporte o carrinho."
  saveShippingTableRates(
    "Omitido = website padrão."
    websiteId: ID

    rates: [ShippingTableRateInput!]!
  ): [ShippingTableRate!]!

  "Login do admin pela API. Erra junto com o painel: tentativas contam para o bloqueio."
  generateAdminToken(username: String!, password: String!): AdminToken!

  "Logout: o token enviado deixa de valer. false sem token."
  revokeAdminToken: Boolean!
}

input ProductAttributeInput {
  code: String!

  "Valor único; vazio ou null apaga."
  value: String

  "Para múltipla seleção; [] apaga."
  values: [String!]
}

input VariantInput {
  "Variação existente; omitido = nova."
  id: ID

  "A combinação, só na nova (ex.: [{code: \"cor\", value: \"azul\"}])."
  options: [ProductAttributeInput!]

  "Omitido = sugerido a partir do SKU do pai e das opções."
  sku: String
  price: String
  isActive: Boolean = true
}

"Arquivo enviado pelo GraphQL multipart request spec (multipart/form-data com operations, map e o arquivo). Exige o token Bearer."
scalar Upload

input ProductStockInput {
  "Código da origem."
  code: String!
  quantity: Float!

  "1 = em estoque, 0 = fora de estoque."
  status: Int = 1
}

input CustomerAttributeInput {
  code: String!

  "Valor único; vazio ou null apaga."
  value: String

  "Para múltipla seleção; [] apaga."
  values: [String!]
}

type CustomerSession {
  "Envie em \"Authorization: Bearer <token>\". null no cadastro que aguarda a confirmação do e-mail."
  token: String

  "Configurações → Clientes → validade do token. O app renova com refreshCustomerToken."
  expires_at: String

  "true: o cliente precisa abrir o link do e-mail (confirmCustomerEmail) antes de entrar."
  confirmationRequired: Boolean!

  customer: Customer!
}

input CustomerAddressInput {
  "Endereço existente; omitido = novo."
  id: ID
  recipient: String

  "Com ou sem máscara."
  postcode: String!
  street: String!
  number: String!
  complement: String
  district: String!
  city: String!

  "UF, ex.: SP."
  region: String!
  telephone: String

  "Os campos que o admin criou no conjunto de endereço."
  attributes: [CustomerAttributeInput!]
  isDefaultShipping: Boolean = false
  isDefaultBilling: Boolean = false
}

input CartAddressInput {
  postcode: String
  street: String
  number: String
  complement: String
  district: String
  city: String
  region: String
  recipient: String
  telephone: String

  "Os campos que o admin criou no conjunto de endereço (attributes(entityType: \"customer_address\"))."
  attributes: [CartAddressAttributeInput!]
}

input CartAddressAttributeInput {
  code: String!
  value: String
  values: [String!]
}

input ShippingTableRateInput {
  postcodeFrom: String!
  postcodeTo: String!

  "Peso até (kg); null = qualquer peso."
  weightTo: Float
  price: Float!
  days: Int = 0
}

type AdminToken {
  "Envie em \"Authorization: Bearer <token>\"."
  token: String!

  "Configurações → Segurança do admin → validade do token."
  expires_at: String!

  user: AdminUser!
}
