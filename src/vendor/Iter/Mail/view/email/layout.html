<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    .content p { margin: 0 0 16px; }
    .content a { color: #111; font-weight: bold; text-decoration: underline; word-break: break-all; }
    .content table { width: 100%; }
    .content td, .content th { padding: 8px 0; border-bottom: 1px solid #e5e5e5; text-align: left; }
</style>
</head>
<body style="margin:0; padding:0; background:#e9e9e9; font-family:Arial, Helvetica, sans-serif; color:#222;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e9e9e9;">
    <tr><td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background:#fff;">
            <tr><td align="center" style="background:#111; padding:36px 32px 28px; color:#fff;">
                <p style="margin:0; font-size:26px; font-weight:bold; letter-spacing:4px; text-transform:uppercase; line-height:1.2;">{{ store_name }}</p>
                <p style="margin:14px auto 0; width:48px; border-top:2px solid #fff; font-size:0; line-height:0;">&nbsp;</p>
            </td></tr>
            <tr><td class="content" style="padding:40px 40px 32px; font-size:15px; line-height:1.6; color:#333;">
                {{{ content }}}
            </td></tr>
            <tr><td style="background:#111; padding:28px 40px; color:#fff;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                        <td style="vertical-align:middle;">
                            <p style="margin:0 0 6px; font-size:16px; font-weight:bold; letter-spacing:2px; text-transform:uppercase;">Obrigado</p>
                            <p style="margin:0; font-size:12px; line-height:1.5; color:#bbb;">Este é um e-mail automático de {{ store_name }}.</p>
                        </td>
                        <td align="right" style="vertical-align:middle;">
                            <span style="display:inline-block; border:2px solid #fff; padding:8px 12px; font-size:11px; font-weight:bold; letter-spacing:2px; text-transform:uppercase;">{{ store_name }}</span>
                        </td>
                    </tr>
                </table>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
