services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: itersotore
      POSTGRES_USER: itersotore
      POSTGRES_PASSWORD: itersotore
    ports:
      - "127.0.0.1:5432:5432" # only this machine; 0.0.0.0 would open the DB to the network
    volumes:
      - iterstore_pgdata:/var/lib/postgresql/data

volumes:
  iterstore_pgdata:
