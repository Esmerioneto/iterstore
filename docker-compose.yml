services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: itersotore
      POSTGRES_USER: itersotore
      POSTGRES_PASSWORD: itersotore
    ports:
      - "5432:5432"
    volumes:
      - iterstore_pgdata:/var/lib/postgresql/data

volumes:
  iterstore_pgdata:
